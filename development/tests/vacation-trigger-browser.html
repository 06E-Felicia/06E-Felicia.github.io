<!doctype html><meta charset="utf-8"><title>Vacation 1.22 actual six-hour weather</title>
<style>body{font:14px system-ui;margin:12px;background:#f8f7fc;color:#413b54}iframe{width:100%;height:1100px;border:0}pre{white-space:pre-wrap}</style>
<h1>Vacation 1.22 · 真实地形六小时过程</h1><pre id="result">Running production Worker / WASM…</pre>
<iframe src="../../Vacation.html?test=acceptance-trigger-six-hour"></iframe>
<script>
(async()=>{const host=document.querySelector('iframe'),out=document.querySelector('#result');const wait=async f=>{const end=performance.now()+600000;while(!f()){if(performance.now()>end)throw Error('Timed out');await new Promise(r=>setTimeout(r,150));}},assert=(v,s)=>{if(!v)throw Error(s);};
try{await wait(()=>host.contentWindow.VacationSimulator);const app=host.contentWindow.VacationSimulator,doc=host.contentDocument;doc.querySelector('#speed').value='3600';doc.querySelector('#basemap').value='none';doc.querySelector('#basemap').dispatchEvent(new Event('change'));await app.start({seed:130363,scenarioGroup:'terrain',weatherRegion:'guangxi',hours:6,quality:'low',controls:{flow:1,humidity:0}});await wait(()=>(app.getState().state==='complete'&&app.getState().latestTime===21600&&app.getState().displayTime===21600)||app.getState().lastError);let s=app.getState();assert(!s.lastError,s.lastError);assert(s.latestTime===21600,'Full six-hour history');assert(s.stats.steps===36&&s.historyFrames===37,'600-second core and initial frame');assert(s.config.initiationModel==='focused_lift'&&s.stats.coldBirths>0,'Physical new closure and regeneration');
const layer=doc.querySelector('select[aria-label="选择气象图 2"]');layer.value='terrain';layer.dispatchEvent(new Event('change'));const timeline=doc.querySelector('#timeline');timeline.value=Math.round(Number(timeline.max)/2);timeline.dispatchEvent(new Event('input'));await wait(()=>Math.abs(app.getState().displayTime-10800)<=300);s=app.getState();assert(s.triggerGrid?.bytes>0&&s.mapViews[1].rasterPixels>0,'Historical terrain field persists');assert(s.historyStart===0&&s.historyEnd===21600,'Beginning and end both retained');
out.textContent='PASS · 六小时真实地形 / 冷池再生 / 原始起生与地形字段\nPASS · 从终点回看三小时，首尾历史完整\n'+JSON.stringify({model:s.modelVersion,seed:s.config.seed,historyStart:s.historyStart,historyEnd:s.historyEnd,displayTime:s.displayTime,births:s.stats.births,coldBirths:s.stats.coldBirths,activityResidual:s.metrics.activityResidual},null,2);document.title='PASS Vacation 1.22 six hours';
}catch(e){out.textContent='FAIL '+e.stack+'\n'+JSON.stringify({error:host.contentWindow.VacationSimulator?.getState().errorDetails,core:host.contentWindow.VacationSimulator?.getState().coreTime,backend:host.contentWindow.VacationSimulator?.getState().numericalBackend},null,2);document.title='FAIL Vacation 1.22 six hours';}})();
</script>
