name: 更新航班数据

on:
  schedule:
    - cron: '5 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 抓取可耗时十多分钟；不在这期间占用天气更新的提交锁。
concurrency:
  group: flightdata-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      scrape_outcome: ${{ steps.scrape.outcome }}
    steps:
      - name: 检出主项目（不检出原导入文件夹的嵌套仓库）
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: flightdata/requirements.txt

      - name: 安装抓取依赖与浏览器
        run: |
          python -m pip install -r flightdata/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 抓取五机场航班快照
        id: scrape
        continue-on-error: true
        run: python flightdata/scraper.py --debug

      - name: 保存抓取诊断截图
        if: steps.scrape.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flightdata-debug
          path: flightdata/data/debug-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 打包采集结果（不包含代码或凭据）
        run: |
          tar --exclude='debug-*.png' -czf "$RUNNER_TEMP/flightdata-snapshots.tgz" flightdata/docs/data flightdata/data

      - name: 保存本轮快照与缓存
        uses: actions/upload-artifact@v4
        with:
          name: flightdata-snapshots
          path: ${{ runner.temp }}/flightdata-snapshots.tgz
          retention-days: 7

  save:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 仅在短暂保存阶段与天气任务串行；检出时取得最新主分支。
    concurrency:
      group: weather-update-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: flightdata-snapshots
          path: ${{ runner.temp }}/flightdata-snapshots

      - name: 恢复本次可信采集任务的固定目录
        run: tar -xzf "$RUNNER_TEMP/flightdata-snapshots/flightdata-snapshots.tgz" -C .

      - name: 提交快照、抓取状态和缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flightdata/docs/data flightdata/data
          if git diff --cached --quiet; then
            echo "航班快照没有变化"
            exit 0
          fi
          git commit -m "Update Flightdat snapshots $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: 标记抓取失败（保留旧快照及最新失败状态）
        if: needs.collect.outputs.scrape_outcome == 'failure'
        run: |
          echo "::error::抓取失败；保留上次成功数据，请查看 flightdata/docs/data/status.json"
          exit 1
