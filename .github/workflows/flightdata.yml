name: 更新航班数据

on:
  schedule:
    # More wake-up opportunities; the freshness gate limits actual collection
    # to once per 10 minutes. GitHub cron is still best-effort, not an SLA.
    - cron: '8,18,28,38,48,58 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 抓取可耗时十多分钟；不在这期间占用天气更新的提交锁。
concurrency:
  group: flightdata-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      scrape_outcome: ${{ steps.scrape.outcome }}
      should_run: ${{ steps.freshness.outputs.run }}
    steps:
      - name: 检出主项目（不检出原导入文件夹的嵌套仓库）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 检查是否满10分钟（跨日与失败可提前补偿）
        id: freshness
        run: python3 flightdata/schedule.py

      - name: 安装 Python
        if: steps.freshness.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: flightdata/requirements.txt

      - name: 安装完整 Chrome 与窗口环境（与本地浏览器一致）
        if: steps.freshness.outputs.run == 'true'
        run: |
          python -m pip install -r flightdata/requirements.txt
          python -m playwright install --with-deps chrome
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: 验证第二页原生翻页链路（离线样例，不访问 FR24）
        if: steps.freshness.outputs.run == 'true'
        run: |
          python tests/test_flightdata_coverage.py -v
          python tests/test_flightdata_pagination.py -v

      - name: 抓取七机场航班快照
        if: steps.freshness.outputs.run == 'true'
        id: scrape
        continue-on-error: true
        env:
          PLAYWRIGHT_CHANNEL: chrome
          FLIGHTDATA_CHECKED_AT: ${{ steps.freshness.outputs.checked_at }}
        run: xvfb-run -a python flightdata/scraper.py --headed --debug

      - name: 汇总实际采集结果（区分部分更新与全部失败）
        if: always() && steps.freshness.outputs.run == 'true' && steps.scrape.outcome != '' && steps.scrape.outcome != 'skipped'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('flightdata/docs/data/status.json')
          data = json.loads(p.read_text()) if p.exists() else {}
          lines = ['## Flightdat 采集结果', '', '保存任务仅负责提交；数据完整性见下表。源站耗尽不等于已核验次日边界。', '', '| 机场 | 结果 | 分页覆盖 | 具体原因 |', '| --- | --- | --- | --- |']
          for code, state in data.get('airports', {}).items():
              result = '失败，保留旧快照' if not state.get('ok') else ('部分更新，保留可用数据' if state.get('partial') else ('当前窗口已更新，全天未开放' if state.get('source_window_limited') else '成功'))
              errors = state.get('errors') or {}
              notes = [b.get('coverage_note') for b in state.get('boards', {}).values() if b.get('coverage_note')]
              detail = state.get('error') or '；'.join(f'{k}: {v}' for k, v in errors.items()) or '；'.join(dict.fromkeys(notes)) or '—'
              detail = str(detail).replace('|', r'\|').replace('\n', ' ')
              coverage = []
              for board, info in state.get('boards', {}).items():
                  label = {'arrivals':'到达', 'departures':'出发'}.get(board, board)
                  reason = info.get('completion_reason')
                  end = '整页跨日已核验' if info.get('boundary_confirmed') else ('当前窗口已读完，未到全天' if reason == 'source_window_exhausted' else ('源站可用页已读完' if reason == 'source_exhausted' else '覆盖未核验'))
                  coverage.append(f'{label} {info.get("pages", 0)}页 · {end}')
              lines.append(f'| {code} | {result} | {"；".join(coverage) or "—"} | {detail} |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('\n'.join(lines)+'\n')
          PY

      - name: 保存抓取诊断截图
        if: always() && steps.freshness.outputs.run == 'true' && (steps.scrape.outcome == 'failure' || steps.scrape.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: flightdata-debug
          path: flightdata/data/debug-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 打包采集结果（不包含代码或凭据）
        if: steps.freshness.outputs.run == 'true'
        run: |
          tar --exclude='debug-*.png' -czf "$RUNNER_TEMP/flightdata-snapshots.tgz" flightdata/docs/data flightdata/data

      - name: 保存本轮快照与缓存
        if: steps.freshness.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flightdata-snapshots
          path: ${{ runner.temp }}/flightdata-snapshots.tgz
          retention-days: 7

  save:
    needs: collect
    if: needs.collect.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 仅在短暂保存阶段与天气任务串行；检出时取得最新主分支。
    concurrency:
      group: weather-update-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: flightdata-snapshots
          path: ${{ runner.temp }}/flightdata-snapshots

      - name: 恢复本次可信采集任务的固定目录
        run: tar -xzf "$RUNNER_TEMP/flightdata-snapshots/flightdata-snapshots.tgz" -C .

      - name: 提交快照、抓取状态和缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flightdata/docs/data flightdata/data
          if git diff --cached --quiet; then
            echo "航班快照没有变化"
            exit 0
          fi
          git commit -m "Update Flightdat snapshots $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: 汇报上游抓取全部失败（数据保存已完成）
        if: needs.collect.outputs.scrape_outcome == 'failure'
        run: |
          echo "::error::数据保存已完成，但本轮上游采集全部失败；旧快照未覆盖，具体异常见 collect 摘要与 flightdata/docs/data/status.json"
          exit 1
