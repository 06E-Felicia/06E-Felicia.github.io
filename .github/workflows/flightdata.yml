name: 更新航班数据

on:
  schedule:
    - cron: '5 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 抓取可耗时十多分钟；不在这期间占用天气更新的提交锁。
concurrency:
  group: flightdata-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      scrape_outcome: ${{ steps.scrape.outcome }}
    steps:
      - name: 检出主项目（不检出原导入文件夹的嵌套仓库）
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: flightdata/requirements.txt

      - name: 安装完整 Chrome 与窗口环境（与本地浏览器一致）
        run: |
          python -m pip install -r flightdata/requirements.txt
          python -m playwright install --with-deps chrome
          sudo apt-get update
          sudo apt-get install -y xvfb xauth

      - name: 验证第二页原生翻页链路（离线样例，不访问 FR24）
        run: python tests/test_flightdata_pagination.py -v

      - name: 抓取五机场航班快照
        id: scrape
        continue-on-error: true
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: xvfb-run -a python flightdata/scraper.py --headed --debug

      - name: 汇总实际采集结果（区分部分更新与全部失败）
        if: always() && steps.scrape.outcome != '' && steps.scrape.outcome != 'skipped'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('flightdata/docs/data/status.json')
          data = json.loads(p.read_text()) if p.exists() else {}
          lines = ['## Flightdat 采集结果', '', '保存任务仅负责提交；数据完整性见下表。', '', '| 机场 | 结果 | 具体原因 |', '| --- | --- | --- |']
          for code, state in data.get('airports', {}).items():
              result = '失败，保留旧快照' if not state.get('ok') else ('部分更新，保留可用数据' if state.get('partial') else '成功')
              errors = state.get('errors') or {}
              detail = state.get('error') or '；'.join(f'{k}: {v}' for k, v in errors.items()) or '—'
              detail = str(detail).replace('|', r'\|').replace('\n', ' ')
              lines.append(f'| {code} | {result} | {detail} |')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('\n'.join(lines)+'\n')
          PY

      - name: 保存抓取诊断截图
        if: always() && (steps.scrape.outcome == 'failure' || steps.scrape.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: flightdata-debug
          path: flightdata/data/debug-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 打包采集结果（不包含代码或凭据）
        run: |
          tar --exclude='debug-*.png' -czf "$RUNNER_TEMP/flightdata-snapshots.tgz" flightdata/docs/data flightdata/data

      - name: 保存本轮快照与缓存
        uses: actions/upload-artifact@v4
        with:
          name: flightdata-snapshots
          path: ${{ runner.temp }}/flightdata-snapshots.tgz
          retention-days: 7

  save:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 仅在短暂保存阶段与天气任务串行；检出时取得最新主分支。
    concurrency:
      group: weather-update-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: flightdata-snapshots
          path: ${{ runner.temp }}/flightdata-snapshots

      - name: 恢复本次可信采集任务的固定目录
        run: tar -xzf "$RUNNER_TEMP/flightdata-snapshots/flightdata-snapshots.tgz" -C .

      - name: 提交快照、抓取状态和缓存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flightdata/docs/data flightdata/data
          if git diff --cached --quiet; then
            echo "航班快照没有变化"
            exit 0
          fi
          git commit -m "Update Flightdat snapshots $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: 汇报上游抓取全部失败（数据保存已完成）
        if: needs.collect.outputs.scrape_outcome == 'failure'
        run: |
          echo "::error::数据保存已完成，但本轮上游采集全部失败；旧快照未覆盖，具体异常见 collect 摘要与 flightdata/docs/data/status.json"
          exit 1
