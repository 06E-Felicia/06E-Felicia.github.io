name: 自动更新天气数据

on:
  schedule:
    # 北京时间 3–5 月每 10 分钟；其他月份每 30 分钟（供手动开启使用）。
    # 错开整点高峰，GitHub 调度仍可能延迟。
    - cron: '7,17,27,37,47,57 * * * *'
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允许手动点击按钮立即运行

concurrency:
  group: weather-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 必须开启写入权限
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: 检查季节更新频率
        id: frequency
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          month = datetime.now(timezone(timedelta(hours=8))).month
          seasonal = 3 <= month <= 5
          fast = os.environ.get("EVENT_SCHEDULE") == "7,17,27,37,47,57 * * * *"
          run = os.environ["EVENT_NAME"] != "schedule" or fast == seasonal
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run={str(run).lower()}\n")
          PY

      - name: 检出代码
        if: steps.frequency.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: 安装 Python
        if: steps.frequency.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 验证估测规则与弹窗逻辑
        if: steps.frequency.outputs.run == 'true'
        run: |
          python -B -m unittest discover -s tests -v
          node tests/test_alerts.cjs

      - name: 获取天气数据更新
        if: steps.frequency.outputs.run == 'true'
        continue-on-error: true
        run: |
          python auto_update/updater.py

      - name: 提交并推送到仓库
        if: steps.frequency.outputs.run == 'true'
        run: |
          git config user.name "WeatherBot"
          git config user.email "bot@weather.com"
          git add config.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto Update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || exit 0
          git push origin HEAD:${{ github.ref_name }}

      # GITHUB_TOKEN pushes do not trigger a branch-source Pages rebuild.
      # Publish the same refreshed checkout explicitly; no personal token needed.
      - name: 配置 GitHub Pages
        if: steps.frequency.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: 上传网站
        if: steps.frequency.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: 发布最新天气数据到网站
        if: steps.frequency.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
