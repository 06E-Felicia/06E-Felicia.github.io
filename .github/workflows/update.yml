name: 自动更新天气数据

on:
  schedule:
    # 北京时间 3–5 月每 10 分钟；其他月份每 30 分钟（供手动开启使用）。
    # 错开整点高峰，GitHub 调度仍可能延迟。
    - cron: '7,17,27,37,47,57 * * * *'
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      monitor_mode:
        description: '全站上游雷暴监测模式（仅管理员控制；深圳官方预警不受影响）'
        type: choice
        required: true
        default: '保持当前设置'
        options:
          - '保持当前设置'
          - '自动（3–5 月）'
          - '开启'
          - '关闭'

concurrency:
  group: weather-update-${{ github.ref }}
  cancel-in-progress: false # 定时任务不能中断正在保存开关设置的管理员操作。

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 必须开启写入权限
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: 检查季节更新频率
        id: frequency
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          month = datetime.now(timezone(timedelta(hours=8))).month
          seasonal = 3 <= month <= 5
          fast = os.environ.get("EVENT_SCHEDULE") == "7,17,27,37,47,57 * * * *"
          run = os.environ["EVENT_NAME"] != "schedule" or fast == seasonal
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run={str(run).lower()}\n")
          PY

      - name: 检出代码
        if: steps.frequency.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: 安装 Python
        if: steps.frequency.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 验证估测规则与弹窗逻辑
        if: steps.frequency.outputs.run == 'true'
        run: |
          python -B -m unittest discover -s tests -v
          node tests/test_alerts.cjs

      - name: 获取天气数据更新
        if: steps.frequency.outputs.run == 'true'
        env:
          THUNDER_MONITOR_MODE: ${{ inputs.monitor_mode || 'keep' }}
        run: |
          python auto_update/updater.py

      - name: 显示后台开关状态
        if: steps.frequency.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          with open("config.json", encoding="utf-8") as source:
              config = json.load(source)
          mode = config["THUNDER_MONITOR_CONFIG"]["default_mode"]
          labels = {"auto": "自动（北京时间 3–5 月）", "on": "开启（全年）", "off": "关闭"}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## 上游雷暴监测后台开关\n\n")
              summary.write(f"当前全站模式：**{labels[mode]}**\n\n")
              summary.write("设置保存在 config.json；后续定时运行保持此设置。\n")
          PY

      - name: 提交并推送到仓库
        if: steps.frequency.outputs.run == 'true'
        run: |
          git config user.name "WeatherBot"
          git config user.email "bot@weather.com"
          git add config.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto Update: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || exit 0
          git push origin HEAD:${{ github.ref_name }}

      # GITHUB_TOKEN pushes do not trigger a branch-source Pages rebuild.
      # Publish the same refreshed checkout explicitly; no personal token needed.
      - name: 配置 GitHub Pages
        if: steps.frequency.outputs.run == 'true'
        uses: actions/configure-pages@v5

      - name: 上传网站
        if: steps.frequency.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: 发布最新天气数据到网站
        if: steps.frequency.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
