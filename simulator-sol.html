<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StormSim 1.1 Sol · 深中气象</title><link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/styles/simulator.css">
  <link rel="stylesheet" href="assets/styles/simulation-v2.css?v=4.2.0">
</head>
<body class="anime-lab sol-lab" data-edition="sol">
<nav class="lab-nav">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">☀</span><h1>StormSim 1.1 Sol</h1></a>
  <div><a href="index.html">今日天气</a><a href="forecast.html">一周预报</a><a href="warnings.html">预警</a><a href="simulator.html">Astra</a><a href="simulator-sol.html" aria-current="page">Sol · 轻量版</a></div>
</nav>
<main>
  <section class="compute-card" aria-label="模拟控制">
    <h2>模拟设置</h2>
    <div class="compute-controls">
      <input id="local-grid" type="hidden" value="28"><input id="compute-mode" type="hidden" value="accurate"><input id="frame-interval" type="hidden" value="60">
      <label>过程时长（小时）<input id="local-hours" type="number" min="1" max="96" value="72"></label>
      <label>时间流速<select id="flow-rate"><option value="60">1 分钟 / 秒</option><option value="300" selected>5 分钟 / 秒</option><option value="900">15 分钟 / 秒</option><option value="1800">30 分钟 / 秒</option><option value="0">最快</option></select></label>
      <button id="start-simulation" class="primary">☀ 开始模拟</button><button id="stop-compute" disabled>结束本轮</button>
    </div>
    <p class="sol-resolution">28 km 网格 · 14 层大气 · 每小时输出。保留冷池、冰相降水和阵风机制；山地与珠江口细节较 Astra 简化，非业务预报。</p>
    <div id="initialization" class="initialization" hidden><div class="init-top"><span>环境初始化</span><span id="compute-percent">载入中</span></div><progress id="compute-progress" max="1" aria-label="环境初始化进度"></progress><p id="compute-remaining" role="status">预计剩余时间：暂无法估计</p></div>
    <p id="compute-status" role="status"></p>
  </section>
  <section class="live-clock-card" aria-label="模拟时钟，UTC+8"><div class="timeline-top">
    <div class="clock-block"><strong id="sim-clock">等待开始</strong><span id="run-info" hidden></span></div>
    <div class="phase-block"><h2 id="phase-title">未开始</h2><p id="runtime-status" class="sr-only" role="status"></p></div>
  </div></section>
  <section id="replay-bar" class="replay-bar" hidden>
    <label for="replay-slider">回顾本轮 <time id="replay-time"></time></label>
    <div class="replay-controls"><button id="toggle-playback" type="button">重新播放</button><input id="replay-slider" type="range" min="0" max="1" step="1" value="0"></div>
  </section>
  <div id="empty-state" class="sr-only" aria-hidden="true"></div>
  <div class="workspace">
    <section class="maps-section">
      <div class="map-toolbar"><div class="segmented"><button data-layout="1">单图</button><button data-layout="2" aria-pressed="true">双图</button><button data-layout="4">四图</button></div><div class="map-actions"><button id="view-region">两广全域</button><button id="view-prd">珠江口</button><button id="add-on-map">＋ 地图选点</button></div></div>
      <div class="map-overlays"><label>底图 <select id="basemap"><option value="satellite">卫星影像</option><option value="street">街道地图</option><option value="none">无在线底图</option></select></label><label><input id="show-stations" type="checkbox" checked>观测点</label><label><input id="show-front" type="checkbox" checked>冷锋</label><label>叠加透明度 <input id="opacity" type="range" min=".15" max="1" step=".05" value=".7"></label></div>
      <div id="map-grid" class="map-grid layout-2"></div><p id="map-status" class="fine-print" role="status"></p>
      <div class="radar-settings"><span id="radar-name">虚拟雷达：深圳</span><label>仰角 <select id="radar-elevation"><option value=".5">0.5°</option><option value="1.5">1.5°</option><option value="2.4">2.4°</option></select></label><label><input id="fold-velocity" type="checkbox">折叠 ±25 m/s</label></div>
    </section>
    <aside class="station-panel">
      <div class="section-title"><h2>观测点</h2></div>
      <label class="sr-only" for="station-search">搜索观测点</label><input id="station-search" type="search" placeholder="站名 / 站号">
      <label class="sr-only" for="station-select">观测点列表</label><select id="station-select" size="4"></select>
      <div class="station-heading"><h3 id="station-name">深圳</h3><span id="station-id">59493</span><p id="station-coordinates"></p><time id="station-time"></time></div>
      <div class="observations" id="observations"></div>
      <div class="station-buttons"><button id="station-center">定位本站</button><button id="station-radar">设为雷达中心</button><button id="export-station">导出已载入观测</button><button id="delete-station" hidden>删除自定义点</button></div>
      <details class="custom-station"><summary>＋ 自定义观测点</summary><form id="station-form"><label>名称<input id="custom-name" maxlength="30" required></label><div class="coordinate-inputs"><label>经度<input id="custom-lon" type="number" step=".0001" min="104.3" max="118" value="113.74" required></label><label>纬度<input id="custom-lat" type="number" step=".0001" min="19.8" max="26.7" value="22.55" required></label></div><button class="primary" type="submit">添加并观测</button></form></details>
      <p id="station-message" class="fine-print" role="status"></p>
    </aside>
  </div>
  <section class="environment-section"><div class="profile-card"><div class="section-title"><h2>温湿廓线</h2><div class="profile-legend"><span>● 气温</span><span>● 露点</span></div></div><canvas id="profile-chart" role="img" aria-label="当前观测点分层温度露点"></canvas></div></section>
  <footer>仅供模拟 · 非实况 / 非业务预报</footer>
</main>
<script src="assets/vendor/leaflet/leaflet.js"></script><script src="assets/scripts/simulation-data.js?v=3.8.0"></script><script src="assets/scripts/simulation-frame-store.js"></script><script src="assets/scripts/simulation-v2.js?v=4.2.1"></script>
</body></html>
